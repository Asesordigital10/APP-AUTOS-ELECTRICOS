<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASYS AUTO - PRO</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="logoasys.png">
    <link rel="apple-touch-icon" href="logoasys.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script type="module">
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA11UK2o8-EgE9vTTcw-eeA55yC-n9eZIg",
            authDomain: "app-autos-electricos-5a311.firebaseapp.com",
            projectId: "app-autos-electricos-5a311",
            storageBucket: "app-autos-electricos-5a311.firebasestorage.app",
            messagingSenderId: "877759630392",
            appId: "1:877759630392:web:eed9d7b0f1a99fd91c2acd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let user = null;
        let historialCargas = [];
        let estadoAuto = { 
            combustibleComparativo: "Super 95",
            nombreUsuario: "",
            marcaModelo: "",
            matricula: "",
            precioKwhManual: 12.00,
            precioCombustibleManual: 88.03,
            capacidadBateria: 54.3,
            rendimientoAnterior: 12,
            precios: { empresa: 4.76, hogarValle: 2.32, uteLenta: 7.54, uteRapida: 10.80 },
            combustibles: { "Super 95": 88.03, "Premium 97": 90.09, "Gasoil 10S": 66.27, "Gasoil 50-S": 57.72 }
        };

        window.loginGoogle = async () => { try { await signInWithPopup(auth, provider); } catch (e) { alert("Error al conectar"); } };
        window.logout = () => { if(confirm("¿Cerrar sesión?")) signOut(auth); };

        onAuthStateChanged(auth, (u) => {
            const loginScreen = document.getElementById('login-screen');
            const mainApp = document.getElementById('main-app');
            if (u) {
                user = u;
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                onSnapshot(query(collection(db, 'users', user.uid, 'cargas'), orderBy('fecha', 'desc')), (snap) => {
                    historialCargas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderizarApp();
                });
                onSnapshot(doc(db, 'users', user.uid, 'config', 'general'), (snap) => {
                    if (snap.exists()) { estadoAuto = { ...estadoAuto, ...snap.data() }; renderizarApp(); }
                });
            } else {
                user = null;
                loginScreen.classList.remove('hidden');
                mainApp.classList.add('hidden');
            }
        });

        const calcularCostoReal = (kwh, tarifa) => {
            const p = estadoAuto.precios;
            if (tarifa === 'uteRapida') return (kwh * p.uteRapida) + 121.9;
            if (tarifa === 'uteLenta') return (kwh * p.uteLenta) + 40;
            if (tarifa === 'empresa' || tarifa === 'hogarValle') return (kwh * p[tarifa] * 1.22) + (100 * 1.22);
            // Si es "Otros", usa el precio manual configurado
            return (kwh * (estadoAuto.precioKwhManual || 12.00) * 1.22);
        };

        window.actualizarPreview = () => {
            const batIn = parseFloat(document.getElementById('bat-inicio').value);
            const batFin = parseFloat(document.getElementById('bat-fin').value);
            const tarifa = document.getElementById('tipo-tarifa').value;
            const preview = document.getElementById('preview-costo');
            if (!isNaN(batIn) && !isNaN(batFin) && tarifa) {
                const kwh = ((batFin - batIn) / 100) * estadoAuto.capacidadBateria;
                const costo = calcularCostoReal(kwh, tarifa);
                preview.innerHTML = `<span class="text-blue-400 font-bold">${kwh.toFixed(1)} kWh</span> | <span class="text-green-500 font-bold">$${costo.toFixed(0)}</span>`;
            }
        };

        window.registrarCarga = async (e) => {
            e.preventDefault();
            const km = parseFloat(document.getElementById('km').value);
            const batIn = parseFloat(document.getElementById('bat-inicio').value);
            const batFin = parseFloat(document.getElementById('bat-fin').value);
            const tarifa = document.getElementById('tipo-tarifa').value;
            const esCien = document.getElementById('es-cien').checked;
            const kwhTotales = ((batFin - batIn) / 100) * estadoAuto.capacidadBateria;
            const costo = calcularCostoReal(kwhTotales, tarifa);
            await addDoc(collection(db, 'users', user.uid, 'cargas'), { fecha: Date.now(), km, batIn, batFin, kwhTotales, costo, tarifaLabel: tarifa, esCien });
            e.target.reset();
            actualizarPreview();
        };

        window.eliminarRegistro = async (id) => { if(confirm("¿Eliminar?")) await deleteDoc(doc(db, 'users', user.uid, 'cargas', id)); };
        
        window.toggleConfig = () => {
            const modal = document.getElementById('modal-config');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('conf-nombre').value = estadoAuto.nombreUsuario || "";
                document.getElementById('conf-modelo').value = estadoAuto.marcaModelo || "";
                document.getElementById('conf-matricula').value = estadoAuto.matricula || "";
                document.getElementById('conf-precio-kwh').value = estadoAuto.precioKwhManual || 12.00;
                document.getElementById('conf-precio-comb').value = estadoAuto.precioCombustibleManual || 88.03;
                document.getElementById('conf-tipo-nafta').value = estadoAuto.combustibleComparativo || "Super 95";
                document.getElementById('conf-bat-tecnica').value = estadoAuto.capacidadBateria || 54.3;
                document.getElementById('conf-rend-tecnico').value = estadoAuto.rendimientoAnterior || 12;
            }
        };

        window.guardarConfig = async () => {
            const data = {
                nombreUsuario: document.getElementById('conf-nombre').value,
                marcaModelo: document.getElementById('conf-modelo').value,
                matricula: document.getElementById('conf-matricula').value,
                precioKwhManual: parseFloat(document.getElementById('conf-precio-kwh').value),
                precioCombustibleManual: parseFloat(document.getElementById('conf-precio-comb').value),
                combustibleComparativo: document.getElementById('conf-tipo-nafta').value,
                capacidadBateria: parseFloat(document.getElementById('conf-bat-tecnica').value),
                rendimientoAnterior: parseFloat(document.getElementById('conf-rend-tecnico').value)
            };
            await setDoc(doc(db, 'users', user.uid, 'config', 'general'), data, { merge: true });
            toggleConfig();
        };

        function renderizarApp() {
            const kmActual = historialCargas[0]?.km || 0;
            const proximoService = Math.ceil((kmActual + 1) / 10000) * 10000;
            const faltanKm = proximoService - kmActual;
            let cargasSinCien = 0;
            for (let c of historialCargas) { if (c.esCien) break; cargasSinCien++; }
            const necesitaBal = cargasSinCien >= 4;
            let ahorroTotal = 0;
            if (historialCargas.length > 1) {
                const ordenadas = [...historialCargas].sort((a,b) => a.km - b.km);
                // Usa el precio manual si existe, sino el de la lista
                const precioNafta = estadoAuto.precioCombustibleManual || estadoAuto.combustibles[estadoAuto.combustibleComparativo];
                for(let i=1; i < ordenadas.length; i++){
                    const dist = ordenadas[i].km - ordenadas[i-1].km;
                    if (dist > 0) {
                        const costoEV = ordenadas[i].costo;
                        const costoNafta = (dist / estadoAuto.rendimientoAnterior) * precioNafta;
                        ahorroTotal += (costoNafta - costoEV);
                    }
                }
            }
            document.getElementById('ahorro-valor').innerText = `$ ${ahorroTotal.toLocaleString('es-UY', {maximumFractionDigits:0})}`;
            document.getElementById('txt-combustible').innerText = `vs ${estadoAuto.combustibleComparativo}`;
            document.getElementById('user-display-name').innerText = estadoAuto.nombreUsuario || user.displayName || "Usuario";
            document.getElementById('car-display-model').innerText = estadoAuto.marcaModelo ? `${estadoAuto.marcaModelo} | Telemetría Activa` : "Telemetría Activa";
            
            document.getElementById('card-mantenimiento').innerHTML = `
                <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-[2rem] flex justify-between items-center shadow-xl">
                    <div><p class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Service Oficial</p><p class="text-xl font-black ${faltanKm < 500 ? 'text-orange-500' : 'text-white'}">${faltanKm.toLocaleString()} KM</p></div>
                    <div class="text-right"><p class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Salud Batería</p><p class="text-sm font-bold ${necesitaBal ? 'text-purple-500 animate-pulse' : 'text-zinc-400'}">${necesitaBal ? '¡CARGAR AL 100%!' : 'BALANCEADA'}</p></div>
                </div>
            `;
            const lista = document.getElementById('lista-cargas');
            lista.innerHTML = historialCargas.slice(0, 5).map(c => `
                <div class="bg-zinc-900/50 p-4 rounded-2xl border border-zinc-800 mb-2 flex justify-between items-center backdrop-blur-sm">
                    <div><p class="font-bold text-sm text-zinc-200">${c.km.toLocaleString()} km ${c.esCien ? '⭐' : ''}</p><p class="text-[10px] text-zinc-600 uppercase font-mono">${new Date(c.fecha).toLocaleDateString()}</p></div>
                    <div class="flex items-center gap-4"><div class="text-right"><p class="text-green-500 font-bold text-sm">$${c.costo.toFixed(0)}</p><p class="text-[10px] text-zinc-600">${c.kwhTotales.toFixed(1)} kWh</p></div><button onclick="eliminarRegistro('${c.id}')" class="text-zinc-800 hover:text-red-500 active:scale-75 transition-transform"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        window.onload = () => { lucide.createIcons(); };
        window.registrarCargaForm = registrarCarga;
    </script>

    <style>
        body { background-color: #000; color: #fff; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        input, select { border-radius: 1rem; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-screen p-8 text-center bg-black">
        <div class="relative mb-8">
            <img src="logoasys.png" alt="Logo" class="w-32 h-32 object-contain relative z-10">
            <div class="absolute inset-0 bg-blue-500/30 blur-3xl rounded-full"></div>
        </div>
        <h1 class="text-4xl font-black italic tracking-tighter text-white mb-2">ASYS AUTO</h1>
        <p class="text-zinc-500 text-sm mb-12 uppercase tracking-widest font-bold">Gestión PRO de Energía</p>
        <button onclick="loginGoogle()" class="flex items-center gap-4 bg-white text-black px-8 py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-transform">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6"> Entrar con Google
        </button>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-app" class="hidden p-6 pb-24">
        
        <div class="flex justify-center mb-6">
            <img src="logoasys.png" alt="Logo" class="w-24 h-24 object-contain">
        </div>

        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 id="user-display-name" class="text-xl font-black italic tracking-tighter text-blue-500 leading-none">...</h1>
                <p id="car-display-model" class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Telemetría Activa</p>
            </div>
            <button onclick="toggleConfig()" class="p-3 bg-zinc-900 border border-zinc-800 rounded-2xl active:scale-90 transition-transform shadow-lg">
                <i data-lucide="settings" class="w-5 h-5 text-zinc-400"></i>
            </button>
        </header>

        <section class="bg-zinc-900/40 p-6 rounded-[2.5rem] border border-zinc-800/50 mb-6 backdrop-blur-md">
            <form onsubmit="registrarCargaForm(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase ml-2 mb-1 block">Kilómetros a la carga</label>
                    <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-4 text-center text-2xl font-black text-white focus:border-blue-500 transition-colors" placeholder="00000">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 uppercase ml-2 mb-1 block">% Inicial</label>
                        <input type="number" id="bat-inicio" oninput="actualizarPreview()" required class="w-full bg-black border border-zinc-800 p-4 text-center text-xl font-bold text-orange-400" placeholder="0">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-zinc-500 uppercase ml-2 mb-1 block">% Final</label>
                        <input type="number" id="bat-fin" oninput="actualizarPreview()" required class="w-full bg-black border border-zinc-800 p-4 text-center text-xl font-bold text-green-400" placeholder="100">
                    </div>
                </div>
                <select id="tipo-tarifa" onchange="actualizarPreview()" required class="w-full bg-black border border-zinc-800 p-4 font-bold text-zinc-400 appearance-none text-center">
                    <option value="">SELECCIONAR TARIFA</option>
                    <option value="hogarValle">Hogar (Tarifa Valle)</option>
                    <option value="uteLenta">Punto UTE (Lento)</option>
                    <option value="uteRapida">Punto UTE (Rápido)</option>
                    <option value="wallboxEspecial">Otros</option>
                </select>
                <div id="preview-costo" class="text-center py-2 text-[10px] font-mono text-zinc-700 tracking-widest uppercase">ESPERANDO DATOS</div>
                <label class="flex justify-between items-center bg-black/30 p-4 rounded-2xl border border-zinc-800 cursor-pointer">
                    <span class="text-xs font-bold uppercase text-zinc-400 italic">¿Carga al 100%?</span>
                    <input type="checkbox" id="es-cien" class="w-6 h-6 rounded-lg accent-blue-600">
                </label>
                <button type="submit" class="w-full bg-blue-600 p-5 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-transform shadow-xl">Registrar Carga</button>
            </form>
        </section>

        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[2.5rem] text-center mb-6 shadow-2xl relative overflow-hidden">
            <p class="text-[10px] uppercase tracking-[0.3em] text-zinc-500 mb-1 font-bold">Ahorro Acumulado</p>
            <p id="ahorro-valor" class="text-6xl font-black text-green-500 italic tracking-tighter mb-1">$ 0</p>
            <p id="txt-combustible" class="text-[10px] font-bold text-zinc-600 uppercase italic">vs Super 95</p>
        </div>

        <div id="card-mantenimiento" class="mb-8"></div>

        <h3 class="text-[10px] font-black uppercase text-zinc-800 mb-4 tracking-[0.2em] flex items-center gap-2">
            <span class="h-px bg-zinc-900 flex-grow"></span> Historial
        </h3>
        <div id="lista-cargas" class="space-y-2"></div>
    </div>

    <!-- MODAL CONFIGURACIÓN ACTUALIZADO -->
    <div id="modal-config" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 p-8 hidden flex flex-col no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-xl font-black uppercase italic text-blue-500">Ajustes</h2>
            <button onclick="toggleConfig()" class="text-zinc-500 p-2"><i data-lucide="x"></i></button>
        </div>
        <div class="space-y-6 pb-10">
            <div>
                <label class="text-[10px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">Nombre en App</label>
                <input id="conf-nombre" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
            </div>
            <div>
                <label class="text-[10px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">Marca y Modelo</label>
                <input id="conf-modelo" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
            </div>
            <div>
                <label class="text-[10px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">Matrícula (Opcional)</label>
                <input id="conf-matricula" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">Precio kWh ($)</label>
                    <input id="conf-precio-kwh" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
                </div>
                <div>
                    <label class="text-[10px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">Precio Combustible ($)</label>
                    <input id="conf-precio-comb" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
                </div>
            </div>

            <div>
                <label class="text-[10px] text-zinc-500 block mb-2 font-bold uppercase tracking-widest">Combustible utilizado antes</label>
                <select id="conf-tipo-nafta" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
                    <option value="Super 95">Super 95</option>
                    <option value="Premium 97">Premium 97</option>
                    <option value="Gasoil 10S">Gasoil 10S</option>
                    <option value="Gasoil 50-S">Gasoil 50-S</option>
                </select>
            </div>

            <!-- SECCIÓN TÉCNICA (Necesaria para cálculos) -->
            <div class="pt-4 border-t border-zinc-800">
                <p class="text-[9px] text-zinc-600 uppercase font-black mb-4 tracking-widest">Datos Técnicos del Vehículo</p>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-zinc-700 block mb-2 font-bold uppercase">Batería (kWh)</label>
                        <input id="conf-bat-tecnica" type="number" step="0.1" class="w-full bg-zinc-950 border border-zinc-900 p-4 text-zinc-400 font-bold text-xs">
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-700 block mb-2 font-bold uppercase">Rendimiento (km/L)</label>
                        <input id="conf-rend-tecnico" type="number" step="0.1" class="w-full bg-zinc-950 border border-zinc-900 p-4 text-zinc-400 font-bold text-xs">
                    </div>
                </div>
            </div>

            <button onclick="guardarConfig()" class="w-full bg-blue-600 p-5 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-transform">Guardar Cambios</button>
            <button onclick="logout()" class="w-full bg-red-900/20 text-red-500 p-5 rounded-2xl font-black uppercase tracking-widest border border-red-900/50">Cerrar Sesión</button>
        </div>
    </div>

</body>
</html>
