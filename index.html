<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASYS AUTO - PRO</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/png" href="logoasys.png">
    <link rel="apple-touch-icon" href="logoasys.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="app.js"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        input, select { border-radius: 1rem; outline: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen">
    <!-- LOGIN -->
    <div id="login-screen" class="flex flex-col items-center justify-center h-screen p-8 text-center bg-black">
        <img src="logoasys.png" class="w-32 h-32 mb-8 object-contain">
        <h1 class="text-4xl font-black italic text-white mb-2">ASYS AUTO</h1>
        <button onclick="window.loginGoogle()" class="bg-white text-black px-8 py-4 rounded-2xl font-bold shadow-xl active:scale-95 transition-all">Entrar con Google</button>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="main-app" class="hidden p-6 pb-24">
        <div class="flex justify-center mb-6"><img src="logoasys.png" class="w-20 h-20 object-contain"></div>
        
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 id="user-display-name" class="text-xl font-black italic text-blue-500">Cargando...</h1>
                <p id="car-display-model" class="text-[9px] font-bold text-zinc-600 uppercase">Telemetría Activa</p>
            </div>
            <button onclick="window.toggleConfig()" class="p-3 bg-zinc-900 border border-zinc-800 rounded-2xl"><i data-lucide="settings" class="w-5 h-5 text-zinc-400"></i></button>
        </header>

        <div id="card-bateria"></div>

        <!-- ESCANER IA -->
        <section class="bg-zinc-900/40 p-6 rounded-[2.5rem] border border-zinc-800/50 mb-8">
            <div id="container-preview" class="hidden mb-4 relative">
                <img id="img-preview" class="w-full h-40 object-cover rounded-2xl">
                <button onclick="window.quitarFoto()" class="absolute top-2 right-2 bg-black/50 p-2 rounded-full text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('input-foto').click()" class="bg-zinc-800 p-4 rounded-2xl text-zinc-400"><i data-lucide="camera" class="w-5 h-5"></i></button>
                <input type="file" id="input-foto" accept="image/*" class="hidden" onchange="window.previsualizarFoto()">
                <input type="text" id="input-busqueda" class="flex-grow bg-black border border-zinc-800 p-4 rounded-2xl text-sm text-white" placeholder="Pregunta algo...">
                <button onclick="window.preguntarIA()" class="bg-blue-600 p-4 rounded-2xl"><i data-lucide="send" class="w-4 h-4 text-white"></i></button>
            </div>
            <div id="sugerencias-manual" class="mt-4 space-y-4"></div>
        </section>

        <!-- FORMULARIO CARGA -->
        <section class="bg-zinc-900/40 p-6 rounded-[2.5rem] border border-zinc-800/50 mb-6">
            <form onsubmit="window.registrarCarga(event)" class="space-y-4">
                <input type="number" id="km" required class="w-full bg-black border border-zinc-800 p-4 text-center text-2xl font-black" placeholder="KM ACTUALES">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="bat-inicio" oninput="window.actualizarPreview()" required class="w-full bg-black border border-zinc-800 p-4 text-center text-xl font-bold text-orange-400" placeholder="% INICIO">
                    <input type="number" id="bat-fin" oninput="window.actualizarPreview()" required class="w-full bg-black border border-zinc-800 p-4 text-center text-xl font-bold text-green-400" placeholder="% FIN">
                </div>
                <select id="tipo-tarifa" onchange="window.actualizarPreview()" required class="w-full bg-black border border-zinc-800 p-4 font-bold text-zinc-400">
                    <option value="">TARIFA DE CARGA</option>
                    <option value="hogarValle">Hogar (Valle)</option>
                    <option value="uteLenta">Punto UTE (Lento)</option>
                    <option value="uteRapida">Punto UTE (Rápido)</option>
                    <option value="wallboxEspecial">Otros</option>
                </select>
                <div id="preview-costo" class="text-center py-2 text-[10px] font-mono text-zinc-700 uppercase italic">ESPERANDO DATOS</div>
                <label class="flex justify-between items-center bg-black/30 p-4 rounded-2xl border border-zinc-800">
                    <span class="text-xs font-bold uppercase text-zinc-400">¿Carga al 100%?</span>
                    <input type="checkbox" id="es-cien" class="w-6 h-6 rounded-lg accent-blue-600">
                </label>
                <button type="submit" class="w-full bg-blue-600 p-5 rounded-2xl font-black uppercase tracking-widest active:scale-95 transition-all">Registrar Carga</button>
            </form>
        </section>

        <!-- AHORRO -->
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-[2.5rem] text-center mb-6 shadow-2xl">
            <p class="text-zinc-500 text-[10px] uppercase font-black mb-1">Ahorro Real</p>
            <p id="ahorro-valor" class="text-6xl font-black text-green-500 italic tracking-tighter mb-1">$ 0</p>
            <div id="fuel-selectors" class="mt-6 grid grid-cols-2 gap-2"></div>
        </div>

        <div id="card-mantenimiento" class="mb-8"></div>
        
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-[10px] font-black uppercase text-zinc-800 tracking-widest">Bitácora</h3>
            <button onclick="window.exportarExcel()" class="text-blue-500 text-[10px] font-black uppercase flex items-center gap-1 bg-blue-500/10 px-3 py-1.5 rounded-full"><i data-lucide="download" class="w-3"></i> Excel</button>
        </div>
        <div id="lista-cargas" class="space-y-2"></div>
    </div>

    <!-- MODAL CONFIGURACIÓN -->
    <div id="modal-config" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 p-8 hidden flex flex-col no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-xl font-black uppercase italic text-blue-500">Ajustes</h2>
            <button onclick="window.toggleConfig()" class="text-zinc-500 p-2"><i data-lucide="x"></i></button>
        </div>
        <div class="space-y-6 pb-10">
            <input id="conf-nombre" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold" placeholder="Nombre">
            <input id="conf-modelo" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold" placeholder="Modelo">
            <input id="conf-matricula" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold" placeholder="Matrícula">
            <select id="conf-tipo-uso" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
                <option value="particular">Particular</option>
                <option value="profesional">Profesional</option>
            </select>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Hogar Valle</label><input id="p-hogar" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">UTE Lenta</label><input id="p-ute-l" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">UTE Rápida</label><input id="p-ute-r" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Otros</label><input id="p-wallbox" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Super 95</label><input id="p-super" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Premium 97</label><input id="p-premium" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Gasoil 10S</label><input id="p-gasoil10" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Gasoil 50S</label><input id="p-gasoil50" type="number" step="0.01" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
            </div>
            <select id="conf-tipo-nafta" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold">
                <option value="Super 95">Super 95</option>
                <option value="Premium 97">Premium 97</option>
                <option value="Gasoil 10S">Gasoil 10S</option>
                <option value="Gasoil 50-S">Gasoil 50-S</option>
            </select>
            <input id="conf-taller" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold" placeholder="Nombre Taller">
            <input id="conf-taller-dir" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold" placeholder="Dirección Taller">
            <input id="conf-taller-tel" type="text" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold" placeholder="WhatsApp Taller">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Batería kWh</label><input id="conf-bat-cap" type="number" step="0.1" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
                <div class="space-y-1"><label class="text-[8px] text-zinc-500 uppercase ml-2">Rend. Nafta</label><input id="conf-rend-ant" type="number" step="0.1" class="w-full bg-zinc-900 border border-zinc-800 p-4 text-white font-bold"></div>
            </div>
            <button onclick="window.guardarConfig(event)" class="w-full bg-blue-600 p-5 rounded-2xl font-black uppercase shadow-xl">Guardar</button>
            <button onclick="window.logout()" class="w-full bg-red-900/20 text-red-500 p-5 rounded-2xl font-black uppercase border border-red-900/50">Cerrar Sesión</button>
        </div>
    </div>
</body>
</html>
